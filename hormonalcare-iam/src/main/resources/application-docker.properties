# Configuración para Docker - IAM Microservice
spring.application.name=hormonal-care-iam

# Configuración de base de datos para Docker
spring.datasource.url=${SPRING_DATASOURCE_URL:jdbc:mysql://mysql-db:3306/hormonal_care?useSSL=false&serverTimezone=UTC}
spring.datasource.username=${SPRING_DATASOURCE_USERNAME:root}
spring.datasource.password=${SPRING_DATASOURCE_PASSWORD:root}
spring.datasource.driver-class-name=com.mysql.cj.jdbc.Driver

# Puerto del microservicio
server.port=8081

# Configuración JPA
spring.jpa.database-platform=org.hibernate.dialect.MySQLDialect
spring.jpa.show-sql=true
spring.jpa.hibernate.ddl-auto=update
spring.jpa.open-in-view=true
spring.jpa.properties.hibernate.dialect=org.hibernate.dialect.MySQLDialect
spring.jpa.hibernate.naming.physical-strategy=com.backend.hormonalcare.shared.infrastructure.persistence.jpa.configuration.strategy.SnakeCase

# JWT Configuration
authorization.jwt.secret=WriteHereYourSecretStringFroTokenSigningCredentialsForHormonalCareApplication
authorization.jwt.expiration.days=7

# OpenAPI Configuration
springdoc.api-docs.path=/iam/v3/api-docs
springdoc.swagger-ui.path=/iam/swagger-ui.html

# Desactivar MongoDB para IAM (solo usa MySQL)
spring.autoconfigure.exclude=org.springframework.boot.autoconfigure.mongo.MongoAutoConfiguration
